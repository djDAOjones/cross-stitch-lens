<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cross Stitch Lens</title>
    <style>
      /* Minimal M1 dev-shell styling; the M2 Carbon layout replaces
        this. Text colours meet the 7:1 AAA contrast bar in both
        schemes. */
      :root {
        color-scheme: light dark;
        --text: #161616;
        --bg: #ffffff;
        --border: #8d8d8d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f4f4f4;
          --bg: #161616;
          --border: #6f6f6f;
        }
      }
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      .meta {
        font-size: 0.875rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      input[type='file'] {
        min-height: 44px;
        padding: 0.5rem 0;
      }
      :focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 2px;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 1rem;
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        cursor: pointer;
      }
      /* Toggle-button on state: inverted fill keeps the 7:1 bar in
        both schemes and is not colour-only (the fill is a shape cue
        alongside aria-pressed). */
      button[aria-pressed='true'] {
        color: var(--bg);
        background: var(--text);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 1.5rem 0 0.5rem;
      }
      /* The worker-rendered preview surface. Pixels are content: no
        filters, no smoothing (crispness comes from the worker). */
      .preview-host {
        position: relative;
        width: 100%;
        height: 60vh;
        overflow: hidden;
        border: 1px solid var(--border);
        cursor: grab;
        touch-action: none;
      }
      .preview-host.grabbing {
        cursor: grabbing;
      }
      .preview-host canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
