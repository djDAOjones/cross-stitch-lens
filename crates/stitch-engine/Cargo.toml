[package]
name = "stitch-engine"
version = "0.1.0"
edition = "2021"
description = "Pattern Mapper native engine: Floyd-Steinberg error diffusion (WASM backend)"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The JS<->Rust interface layer wasm-pack builds against.
wasm-bindgen = "0.2"
# fdlibm-derived pow/cbrt: the same lineage as V8's Math.pow/Math.cbrt,
# required for bit-exact parity with the TS reference (decision-log).
libm = "0.2"

[profile.release]
# Exact arithmetic parity forbids fast-math-style shortcuts; these are
# safe size/speed knobs only.
opt-level = 3
lto = true
