<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cross Stitch Lens</title>
    <style>
      /* Minimal M1 dev-shell styling; the M2 Carbon layout replaces
        this. Text colours meet the 7:1 AAA contrast bar in both
        schemes. */
      :root {
        color-scheme: light dark;
        --text: #161616;
        --bg: #ffffff;
        --border: #8d8d8d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f4f4f4;
          --bg: #161616;
          --border: #6f6f6f;
        }
      }
      body {
        margin: 0;
        /* Narrow-first padding: 4rem of horizontal padding is a fifth
          of a 320 px companion window. */
        padding: 1rem 0.75rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
      }
      /* `hidden` is how the shell removes a region from layout *and*
        from the focus order; no display rule may quietly outrank it. */
      [hidden] {
        display: none !important;
      }
      .app-header {
        margin-bottom: 0.5rem;
      }
      /* Shell bar: collapse and preview-focus live on a permanent
        surface, so the way out of a mode is always in one place. */
      .shell-bar {
        margin-top: 0.5rem;
      }
      /* Layout model (UI-STANDARDS): preview column and settings panel.
        Preview-first in the DOM at every width, with the panel to its
        right when there is room — so reading order, visual order, and
        tab order agree instead of being reordered into conflict. Below
        the breakpoint it is a single preview-first column, which is the
        companion-window case (M6-NARROW-01). */
      .app-layout {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: stretch;
      }
      .controls {
        border: 1px solid var(--border);
        padding: 1rem;
        /* A zero minimum: an intrinsic min-content floor here is what
          pushes a flex row wider than its container. */
        min-width: 0;
      }
      .content {
        min-width: 0;
      }
      @media (min-width: 60rem) {
        .app-layout {
          flex-direction: row;
          align-items: flex-start;
        }
        .content {
          flex: 1 1 auto;
        }
        .controls {
          flex: 0 0 16rem;
        }
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 1.5rem;
      }
      fieldset:last-child {
        margin-bottom: 0;
      }
      legend {
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0;
        margin-bottom: 0.75rem;
      }
      .field {
        margin-bottom: 0.75rem;
      }
      .field label {
        display: block;
        font-size: 0.75rem;
        margin-bottom: 0.25rem;
      }
      .field .helper {
        font-size: 0.75rem;
        margin: 0.25rem 0 0;
      }
      /* Method-specific dither controls sit visibly subordinate to the
        algorithm selector that owns them (M8-CTRL-01). */
      .dither-method {
        padding-left: 0.75rem;
        border-left: 2px solid var(--border);
      }
      input[type='number'],
      input[type='text'],
      select {
        width: 100%;
        min-height: 44px;
        padding: 0 0.5rem;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
      }
      input[type='color'] {
        width: 4rem;
        min-height: 44px;
        padding: 0.125rem;
        background: transparent;
        border: 1px solid var(--border);
      }
      /* Carbon-style toggle: switch-role checkbox drawn as a track +
        thumb; state also carried by the On/Off text (never
        colour-only). */
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
      }
      input.toggle {
        appearance: none;
        width: 3rem;
        height: 1.5rem;
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--bg);
        cursor: pointer;
        position: relative;
      }
      /* Carbon draws the switch 24 px tall, which is under the AAA
        44 px target. Extend the *hit* area with a transparent
        pseudo-element rather than inflating the track: clicks on a
        pseudo-element target its originating input, so the control
        keeps Carbon's proportions and still takes a 44 px tap. */
      input.toggle::before {
        content: '';
        position: absolute;
        inset: -10px 0;
      }
      input.toggle::after {
        content: '';
        position: absolute;
        top: 0.1875rem;
        left: 0.1875rem;
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        background: var(--border);
        transition: transform 0.1s ease-out;
      }
      input.toggle:checked {
        background: var(--text);
        border-color: var(--text);
      }
      input.toggle:checked::after {
        background: var(--bg);
        transform: translateX(1.5rem);
      }
      input.toggle:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      @media (prefers-reduced-motion: reduce) {
        input.toggle::after {
          transition: none;
        }
      }
      .meta {
        font-size: 0.875rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      input[type='file'] {
        min-height: 44px;
        max-width: 100%;
        padding: 0.5rem 0;
      }
      :focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 2px;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 1rem;
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--border);
        cursor: pointer;
      }
      /* Toggle-button on state: inverted fill keeps the 7:1 bar in
        both schemes and is not colour-only (the fill is a shape cue
        alongside aria-pressed). */
      button[aria-pressed='true'] {
        color: var(--bg);
        background: var(--text);
      }
      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1.5rem 0 0.5rem;
      }
      .split-control {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .split-control label {
        display: inline;
        margin-bottom: 0;
      }
      .split-control input[type='range'] {
        width: 8rem;
        min-height: 44px;
        accent-color: var(--text);
      }
      /* Live capture thumbnail + crop region. Dimming outside the
        region is a thumbnail affordance only — the preview canvas
        itself is never filtered. State is never colour-only: the
        dashed border is a shape cue and the readout carries the
        numbers. */
      .capture-thumb {
        position: relative;
        max-width: min(30rem, 100%);
        margin-top: 0.75rem;
      }
      .capture-thumb video {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--border);
      }
      .crop-overlay {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: crosshair;
        touch-action: none;
      }
      .crop-overlay.locked {
        cursor: default;
      }
      .crop-rect {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed #ffffff;
        outline: 2px dashed #161616;
        outline-offset: -4px;
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 0.35);
      }
      .crop-overlay.locked .crop-rect {
        border-style: solid;
        outline-style: solid;
      }
      .crop-handle {
        position: absolute;
        width: 0.75rem;
        height: 0.75rem;
        background: #ffffff;
        border: 1px solid #161616;
      }
      .crop-overlay.locked .crop-handle {
        display: none;
      }
      .crop-nw { top: -0.375rem; left: -0.375rem; }
      .crop-n { top: -0.375rem; left: calc(50% - 0.375rem); }
      .crop-ne { top: -0.375rem; right: -0.375rem; }
      .crop-e { top: calc(50% - 0.375rem); right: -0.375rem; }
      .crop-se { bottom: -0.375rem; right: -0.375rem; }
      .crop-s { bottom: -0.375rem; left: calc(50% - 0.375rem); }
      .crop-sw { bottom: -0.375rem; left: -0.375rem; }
      .crop-w { top: calc(50% - 0.375rem); left: -0.375rem; }
      /* The worker-rendered preview surface. Pixels are content: no
        filters, no smoothing (crispness comes from the worker). */
      .preview-host {
        position: relative;
        width: 100%;
        /* Dynamic viewport units: `vh` on mobile Safari measures the
          chrome-less viewport and pushes controls off-screen. */
        height: 60dvh;
        min-height: 16rem;
        overflow: hidden;
        border: 1px solid var(--border);
        cursor: grab;
        touch-action: none;
      }
      .preview-host.grabbing {
        cursor: grabbing;
      }
      /* Preview focus: the preview takes the window. Built as a flex
        chain down to the host rather than `100vh minus a guess`, so
        the height stays correct when the toolbar wraps to two rows at
        a narrow width or the text size changes. */
      body.preview-focus {
        height: 100dvh;
        /* Without border-box the 1 rem padding is added *outside* the
          100dvh, making the body taller than the viewport and pushing
          the compact status under the fold — where `overflow: hidden`
          then clips the mode's only status line. */
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      body.preview-focus main,
      body.preview-focus .app-layout,
      body.preview-focus .content,
      body.preview-focus .content > section {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        /* Restated, not inherited: the wide-layout media query sets
          `align-items: flex-start` for the side-by-side row, and left
          in place here it becomes a *cross-axis* rule that shrinks
          every child to its content width. */
        align-items: stretch;
      }
      /* `main` keeps `margin: 0 auto` for centring, and auto margins on
        the cross axis suppress `align-items: stretch` — without an
        explicit width it collapses to its content and the preview gets
        *smaller* in the mode meant to enlarge it. */
      body.preview-focus main {
        width: 100%;
      }
      /* Trade the title block for preview height: the app name stays
        as the landmark, the build line is still in diagnostics. */
      body.preview-focus .app-header {
        flex: 0 0 auto;
        margin-bottom: 0;
      }
      body.preview-focus .app-header h1 {
        font-size: 1rem;
        margin: 0;
      }
      body.preview-focus .app-header .meta {
        display: none;
      }
      body.preview-focus .preview-host {
        flex: 1 1 auto;
        height: auto;
      }
      /* The compact status is the only status in focus mode, so it
        keeps full-size text rather than the .meta reduction. */
      .compact-status {
        margin: 0.5rem 0 0;
        font-size: 1rem;
      }
      /* Info panel: summary + colours-by-usage table. Swatch colours
        are content (thread colours), never UI tokens. Wide tables
        scroll inside their own panel rather than pushing the page
        sideways — page-level horizontal scrolling is the thing a
        companion window must never do (WCAG 2.2 Reflow). */
      .info-panel,
      .debug-panel {
        max-width: 100%;
        overflow-x: auto;
      }
      .info-panel table,
      .debug-panel table {
        border-collapse: collapse;
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }
      .info-panel caption,
      .debug-panel caption {
        text-align: left;
        font-size: 0.875rem;
        margin-bottom: 0.25rem;
      }
      .info-panel th,
      .info-panel td,
      .debug-panel th,
      .debug-panel td {
        text-align: left;
        padding: 0.25rem 1rem 0.25rem 0;
        border-bottom: 1px solid var(--border);
      }
      .info-panel th.num,
      .info-panel td.num,
      .debug-panel th.num,
      .debug-panel td.num {
        text-align: right;
      }
      /* Profiling debug panel (dev-only): a native disclosure so the
        timings table is keyboard operable for free. */
      .debug-panel {
        margin-top: 1rem;
      }
      .debug-panel summary {
        display: flex;
        align-items: center;
        min-height: 44px;
        cursor: pointer;
        font-size: 0.875rem;
      }
      .debug-panel summary::before {
        content: '\25B8';
        margin-right: 0.5rem;
      }
      .debug-panel[open] summary::before {
        content: '\25BE';
      }
      .debug-panel summary::-webkit-details-marker,
      .debug-panel summary::marker {
        display: none;
        content: '';
      }
      .swatch {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        border: 1px solid var(--border);
        vertical-align: -0.125rem;
        margin-right: 0.5rem;
      }
      .preview-host canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
