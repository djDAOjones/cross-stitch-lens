<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pattern Mapper</title>
    <style>
      /* Critical-path minimum (M14-IMPL-01, D81): everything else
        lives in src/ui/styles/*, imported through the bundle. This
        block exists solely so the pre-bundle blank page respects the
        colour scheme — without it a dark-scheme load flashes white
        before the stylesheets arrive. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161616;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
